[pytest]
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

testpaths = tests

addopts =
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto
    --color=yes

markers =
    unit: Unit tests with mocked dependencies
    integration: Integration tests requiring database

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
